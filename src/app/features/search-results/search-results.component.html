<div class="results-page">
  <app-header [searchParams]="searchParams" (goBackOutput)="goBack()"></app-header>
@if (isLoading)){
    <app-spinner
      [text]="'Buscando los mejores vuelos...'"
    ></app-spinner>
}@else if(error())
<app-error-message
[errorText]="error()"
(clickOutput)="goBack()"
[buttonText]="'Volver a buscar'"
></app-error-message>
}@else{
  <div class="results-body">
<app-flightfilters
[sortBy]=this.sortBy()"
[maxPrice]="searchParams.maxPrice"
(sortByOutput)="setSortBy($event)"
(maxPriceOutput)="setMaxPrice($event)"
></app-flightfilters>
<app-flight-list
[filteredFlights]="this.filteredFlights"

></app-flight-list>
  </div>
}



</div>
