  <!-- PANEL DE FILTROS (extraer a FlightFiltersComponent) -->
  <!-- si tienes forms hay que ponerlo en un form group, y luego en
    el html haces formGroup y le pasas el form que has creado en el ts, y
     luego a cada input le pones formControlName con el nombre del control que has
      creado en el form group, asi se vincula todo y ya puedes acceder a los valores 
      de los controles desde el form group en el ts.
  en el ts, creas un form group con los controles que necesites, por ejemplo -->
  
  <form [formGroup]="form">
  <aside class="filters-panel">
        <h2 class="filters-panel__title">Filtros</h2>

        <mat-form-field appearance="outline" class="filters-panel__field">
          <mat-label>Precio máximo (€)</mat-label>

          <!-- por eso aqui pones formcontrolname porque los pones los dos juntos en el ts y ya
            luego en el template escoges cual usar -->
          <input matInput type="number" formControlName="maxPrice" min="0" />
        </mat-form-field>

        <mat-form-field appearance="outline" class="filters-panel__field">
          <mat-label>Ordenar por</mat-label>
          <mat-select formControlName="sortBy">
            <mat-option value="price">Precio</mat-option>
            <mat-option value="departure">Hora de salida</mat-option>
            <mat-option value="duration">Duración</mat-option>
          </mat-select>
        </mat-form-field>
      </aside>
</form>
